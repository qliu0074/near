name: checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r api/requirements.txt
      - run: cd api && python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci
      - run: cd web && npm test && npm run typecheck && npm run build
  http:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      EMAIL_MODE: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r api/requirements.txt
      - run: cd web && npm ci && npm run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: .venv/bin/python scripts/run-local.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
